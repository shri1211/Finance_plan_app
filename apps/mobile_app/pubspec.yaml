name: mobile_app
description: "FinTrack - Smart Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Local packages
  core:
    path: ../../packages/core
  domain:
    path: ../../packages/domain
  data:
    path: ../../packages/data
  ui_kit:
    path: ../../packages/ui_kit
  services:
    path: ../../packages/services
  analytics:
    path: ../../packages/analytics

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.68.0

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_flavorizr: ^2.4.2

flutter:
  uses-material-design: true

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
  flavors:
    dev:
      app:
        name: "FinTrack Dev"
      android:
        applicationId: "com.example.fintrack.dev"
      ios:
        bundleId: "com.example.fintrack.dev"
    staging:
      app:
        name: "FinTrack Stg"
      android:
        applicationId: "com.example.fintrack.staging"
      ios:
        bundleId: "com.example.fintrack.staging"
    prod:
      app:
        name: "FinTrack"
      android:
        applicationId: "com.example.fintrack"
      ios:
        bundleId: "com.example.fintrack"
  instructions:
    - assets:download
    - assets:extract
    - android:androidManifest
    - android:flavorizrGradle
    - android:buildGradle
    - android:dummyAssets
    - android:icons
    - flutter:flavors
    - flutter:app
    - flutter:pages
    - flutter:main
    - ios:podfile
    - ios:xcconfig
    - ios:buildTargets
    - ios:schema
    - ios:dummyAssets
    - ios:icons
    - ios:plist
    - ios:launchScreen
    - google:firebase
    - huawei:agconnect
    - assets:clean
    - ide:config
